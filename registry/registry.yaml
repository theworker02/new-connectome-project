# Verified public insect / arthropod EM & connectomics datasets
# Fields use null when not verified. Do not invent metadata.
# Last audited: 2026-09-22

version: 1
audit_date: "2026-09-22"
notes: >
  Registry seeded from direct repository inspection (BossDB project pages,
  CREMI data page, Janelia FlyEM source-data page, Heinze et al. preprint,
  Insect Brain Database / Sayre et al. bumblebee projectome). Access status
  reflects downloadability of RAW EM for independent reconstruction.

datasets:

  - dataset_id: hemibrain_neuprint
    species: Drosophila melanogaster
    taxonomic_order: Diptera
    common_name: fruit fly
    specimen_id: hemibrain
    sex: female
    developmental_stage: adult
    anatomical_region: central brain (hemibrain)
    imaging_method: FIB-SEM
    voxel_size_nm: [8.0, 8.0, 8.0]
    volume_dimensions: UNKNOWN
    estimated_volume: "~26 TB raw EM (published estimate); connectome via neuPrint"
    source_repository: neuPrint / Janelia FlyEM
    source_URL_or_identifier: "https://neuprint.janelia.org (dataset hemibrain:v1.2.1)"
    publication: "Scheffer et al. eLife 2020 e57443"
    DOI: "10.7554/eLife.57443"
    license: UNKNOWN
    access_status: PUBLIC_API
    raw_data_available: true
    segmentation_available: true
    synapse_annotations_available: true
    skeletons_available: true
    cell_annotations_available: true
    download_method: neuprint_api
    estimated_download_size: "graph pack MB–low-GB; do NOT download full EM"
    checksum_information: null
    connectomics_suitability: CONNECTOME_READY
    processability_rank: 0
    notes: >
      LEVEL 0 reuse. Query neuPrint for neurons/connectivity. Raw EM remains remote
      (Neuroglancer/GCS). Requires NEUPRINT_APPLICATION_CREDENTIALS.

